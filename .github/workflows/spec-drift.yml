name: Spec drift

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Exit 1 means the six endpoints' schemas changed, 2 means the comparison could not run.
      # It never rewrites the snapshot; update testdata/openapi.json by hand.
      - name: Compare the live OpenAPI spec with the snapshot
        run: go run ./internal/tools/specdrift
